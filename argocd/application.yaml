apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camera-stack
  namespace: openshift-gitops

spec:
  project: default

  source:
    repoURL: https://github.com/stolarware/camera-stack.git
    targetRevision: main
    path: .

    helm:
      valueFiles:
        - values.yaml
        - values-sno.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: kamery
    
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
